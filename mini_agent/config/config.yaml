# Mini Agent Configuration - Optimized for MiniMax + Z.AI Integration
# Primary: MiniMax-M2 (300 prompts/5hrs) for reasoning
# Secondary: Z.AI GLM-4.6 (120 prompts/5hrs) for web intelligence

# ===== LLM Configuration =====
# MiniMax API Configuration (Primary - 300 prompts/5hrs)
api_key: "${MINIMAX_API_KEY}"
api_base: "https://api.minimax.io"   # Global platform
model: "MiniMax-M2"
# AI model: "anthropic" or "openai" 
# MiniMax uses OpenAI-compatible API for broad compatibility
provider: "openai"  # OpenAI SDK format"

# Optional: OpenAI SDK format integration (fallback)
openai_api_key: "${OPENAI_API_KEY}"
openai_base: "https://api.openai.com/v1"
minimax_model: "glm-4.6 (via Z.AI)"  # NOTE: Unused fallback - actual model is MiniMax-M2

# ===== Retry Configuration =====
retry:
  enabled: true           # Enable retry mechanism
  max_retries: 3          # Maximum number of retries
  initial_delay: 1.0      # Initial delay time (seconds)
  max_delay: 60.0         # Maximum delay time (seconds)
  exponential_base: 2.0   # Exponential backoff base

# ===== Agent Configuration =====
max_steps: 200  # Maximum execution steps
workspace_dir: "."  # Working directory (root directory)
system_prompt_path: "system_prompt.md"  # System prompt file (same config directory)
debug: true

# ===== Tools Configuration =====
tools:
  # Basic tool switches
  enable_file_tools: true  # File read/write/edit tools (unlimited operations)
  enable_bash: true        # Bash command execution tool
  enable_note: true        # Session note tool (SessionNoteTool)

  # Z.AI Tools - MCP Protocol Integration (FREE quotas)
  # ✅ Using MCP servers for FREE Lite plan quotas
  # 📊 Quotas: 100 web searches + 100 web readers (FREE with Lite plan)
  # 🔒 CREDIT PROTECTION: Only MCP tools enabled, direct API calls disabled
  enable_zai_search: true          # Z.AI MCP Web Search: ENABLED (FREE quotas)
  enable_zai_llm: false           # Direct Z.AI LLM: DISABLED - Credit protection
  zai_settings:
    # MCP Protocol integration (FREE quotas)
    use_mcp_protocol: true         # Use MCP servers (FREE quotas)
    mcp_config_path: "mini_agent/config/z_mcp_servers.json"  # MCP server configuration
    # ⚠️ OLD PAID ENDPOINTS DISABLED - Migrating to FREE MCP
    use_direct_api: false          # ❌ DISABLED - was burning credits
    zai_base: ""                   # ❌ Empty - no longer using paid endpoints
    # ✅ NEW MCP INTEGRATION - FREE with Lite plan
    search_quota_limit: 100        # FREE web searches included
    reader_quota_limit: 100        # FREE web readers included
    track_mcp_usage: true          # Monitor MCP quota usage
    enable_web_search_mcp: true    # ✅ Use free MCP web search
    enable_web_reader_mcp: true    # ✅ Use free MCP web reader

  # MiniMax-M2 Skills (15 specialized skills)
  enable_skills: true      # Enable Skills system
  skills_dir: "./skills"   # Skills directory path

  # MCP Tools
  enable_mcp: true         # Enable MCP tools
  mcp_config_path: ".mcp.json"  # MCP configuration file (standard naming)
                           # Note: API Keys for MCP tools configured in mcp.json